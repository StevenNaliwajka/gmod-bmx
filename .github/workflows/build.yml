name: build

# Two jobs, and only one of them is about releasing.
#
# `check` runs on every push and pull request. It is the one that earns its
# keep: a GLua syntax error does not fail loudly, it silently stops the whole
# addon loading, and finding that out on a server is a slow round trip.
#
# `release` runs only on a version tag and attaches a .gma to the GitHub
# release. Note that GitHub is the PRIMARY distribution channel for this addon:
# server owners clone straight into garrysmod/addons and never touch a .gma at
# all. The .gma exists for the Workshop, which is published manually with
# gmpublish because it needs a Steam login that has no business in CI.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  check:
    name: lua syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A real 5.1 front end from apt rather than the Docker fallback: the
      # runner already has apt and pulling an image to run one parser is waste.
      - name: install lua 5.1
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lua5.1

      - name: parse every file
        run: LUAC=luac5.1 ./tools/syntax-check.sh

  pack:
    name: pack gma
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: build
        run: python3 tools/gmad.py -o bmx.gma

      # Uploaded on every branch build too, not just tags: being able to grab
      # the artifact from a PR is how you test a change on a server without
      # merging it first.
      - uses: actions/upload-artifact@v4
        with:
          name: bmx-gma
          path: bmx.gma
          retention-days: 14

  release:
    name: attach to release
    runs-on: ubuntu-latest
    needs: pack
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: build
        run: python3 tools/gmad.py -o bmx-${{ github.ref_name }}.gma

      - uses: softprops/action-gh-release@v2
        with:
          files: bmx-${{ github.ref_name }}.gma
          generate_release_notes: true
