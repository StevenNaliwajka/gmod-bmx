# CI/CD template — dev (sen2) --auto--> prod twin (sen1, manual gate).
#
# THIS FILE USED TO BE THE WHOLE PIPELINE. It carried the stages, the job bodies and a
# hard-coded `pct exec`, and core/push_ci.py rendered all of it into every service repo.
# That meant the mechanics were COPIED into ~25 repos, so changing how a deploy works
# meant re-pushing every one of them — and in practice nobody did, which is how repos
# ended up on different vintages of the same pipeline.
#
# The mechanics now live once, in root/ci-templates /deploy.yml, and each repo INCLUDES
# them. A service repo declares only what is true of that service. The shared template
# resolves container-vs-VM itself (deploy-guard reads /etc/pve), SHA-pins the deploy,
# and offers a health gate with rollback.
#
# WHAT A REPO STILL DECIDES
#   DEV_CT / PROD_CT  the guests to deploy to. THE ONLY VALUES MOST REPOS NEED.
#   APP_DIR           the checkout inside the guest, /opt/<name> by convention.
#   ENTRYPOINT        install.sh (the shared default) or setup.sh.
#   HEALTH_CMD        optional. Empty means deploy-only, still SHA-pinned. Set it to a
#                     command that proves the service SERVES, not merely that it
#                     started: data-api passed a unit-active-and-port-listening check
#                     while unable to answer a single query, because it binds its socket
#                     before it touches PostgreSQL.
#
# WHY THE VMIDs ARE THE DANGEROUS FIELD. Nothing in GitLab checks that a VMID is a guest
# that still serves. On 2026-08-25, 22 of 28 repos were deploying to containers their v2
# guests had replaced — successfully, greenly, and to no effect. core/ci_target_audit.py
# grades these against the live fleet and the nightly registry-audit reports it.
#
# This file is a TEMPLATE. core/push_ci.py substitutes the __TOKENS__ and commits the
# rendered .gitlab-ci.yml onto each service repo's DEFAULT branch. Do not hand-edit a
# deployed .gitlab-ci.yml — edit here and re-push, or the copies drift again.
include:
  - project: 'root/ci-templates'
    ref: main
    file: '/deploy.yml'

variables:
  DEV_CT: "110149"
  PROD_CT: ""
  APP_DIR: "/opt/gmod/garrysmod/addons/gmod-bmx"
  ENTRYPOINT: "install.sh"
  HEALTH_CMD: "systemctl is-active --quiet gmod"

# ---------------------------------------------------------------------------
# THE HEADLESS SIMULATION SUITE.
#
# The shared template gives validate -> deploy-dev -> deploy-prod. This adds a
# stage between the first two that does the thing this repo actually needs: run
# the addon's 17 physics cases on a REAL Garry's Mod server and fail the
# pipeline if the bike stops behaving.
#
# WHY IT CANNOT LIVE IN validate. The suite is not a unit test. It seats a bot on
# a bike and measures ride height, tyre saturation, lean tracking and wheelie
# pitch against a running VPhysics -- so it needs srcds, a map and a tick, none
# of which exist on the runner. The box is VM 110149; there is no prod twin and
# there must not be one (PROD_CT is empty above, so deploy-prod does not exist).
#
# WHY IT RUNS ON EVERY BRANCH while deploy-dev only runs on the default branch.
# Those are different jobs answering different questions. deploy-dev publishes
# the default branch to the dev box and is the estate's deploy rule. This job
# BORROWS the box for one run: it checks the pipeline's own commit out, tests
# it, and leaves it there. A physics addon whose branches are only tested after
# merging is a physics addon that is tested too late.
#
# resource_group SERIALISES those borrows. There is exactly one game server, and
# two pipelines restarting it at once would interleave into a result that
# describes neither commit.
stages: [validate, deploy-dev, headless, deploy-prod]

headless:
  stage: headless
  tags: [deploy]
  resource_group: gmod-dev
  # Above bmx-test's own ceiling (BMX_RUN_MAX 2700 s) plus boot, deploy and the
  # two server restarts, so the script's clear "no results after Ns" error fires
  # before GitLab's blunt kill. It was 40m when the suite was a few dozen cases.
  timeout: 60m
  # Not `needs: [deploy-dev]`: that job does not exist on a feature branch, and a
  # needs on a job that was never created skips this one silently. Stage order
  # already gives the sequencing on the default branch.
  script:
    - |
      set -eu
      SSH="ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new root@${DEV_NODE}"
      EXEC="guest-exec ${DEV_CT} --"
      echo "▶ ${CI_COMMIT_SHORT_SHA} -> guest ${DEV_CT}"
      # Two steps, and the order is the point. The first puts BOTH the addon and
      # its test runner on the box at this exact commit -- a new suite run by an
      # old harness is the failure mode this avoids. The second then tests what
      # is on disk, so the runner and the code it runs are never different
      # vintages.
      # ALREADY THERE, NO RESTART. On the default branch deploy-dev has just
      # installed this very commit, and install.sh restarts the server: doing it
      # again disconnected anyone riding a second time, eleven seconds after the
      # first. Only a commit that is not on the box yet is checked out.
      $SSH "$EXEC 'git config --global --add safe.directory ${APP_DIR} && cd ${APP_DIR} && git fetch -q origin && if [ \"\$(git rev-parse HEAD)\" = \"${CI_COMMIT_SHA}\" ] && git diff --quiet HEAD; then echo \"already at ${CI_COMMIT_SHORT_SHA}: no reinstall, no restart\"; else git checkout -f ${CI_COMMIT_SHA} && bash install.sh; fi'"
      $SSH "$EXEC '/usr/local/bin/bmx-test'"
